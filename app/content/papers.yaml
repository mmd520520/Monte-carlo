# Papers on the Science home page. Every entry has zh and en text; links are DOIs or official pages.
classic:
  - title: "MCML—Monte Carlo modeling of light transport in multi-layered tissues"
    cite: "Wang L, Jacques SL, Zheng L. Computer Methods and Programs in Biomedicine, 1995, 47(2): 131–146"
    link: "https://doi.org/10.1016/0169-2607(95)01640-F"
    zh: "多层组织蒙特卡洛的标准程序：光子包的权重、Henyey–Greenstein 散射、Fresnel 边界、轮盘赌。"
    en: "The standard multi-layer tissue Monte Carlo: photon-packet weights, Henyey–Greenstein scattering, Fresnel boundaries, roulette."
    tool_zh: "本引擎的光子“一生”沿用这一套步骤（见“仿真”和 docs/algorithm.md）。"
    tool_en: "This engine's photon life cycle follows these steps (see Simulation and docs/algorithm.md)."
  - title: "Tutorial on Monte Carlo simulation of photon transport in biological tissues"
    cite: "Jacques SL. Biomedical Optics Express, 2023, 14(2): 559–576"
    link: "https://doi.org/10.1364/BOE.477237"
    zh: "给新手的教程：蒙特卡洛抽样、程序的基本结构、生物医学应用实例。"
    en: "A tutorial for newcomers: Monte Carlo sampling, the basic structure of a program, biomedical examples."
    tool_zh: "原 MATLAB 版的流程图依据这篇教程第 3 节和图 6。"
    tool_en: "The flowchart of the original MATLAB version follows section 3 and figure 6 of this tutorial."
  - title: "mcxyz: voxelized Monte Carlo (skin with a blood vessel)"
    cite: "Jacques SL. Oregon Medical Laser Center software page"
    link: "https://omlc.org/software/mc/mcxyz/"
    zh: "mcml 的三维体素版本；经典示例是皮肤里的一根血管。"
    en: "A 3D voxel version of mcml; the classic example is a blood vessel in skin."
    tool_zh: "“仿真”页的皮肤血管预设（500 nm）是同一类问题。"
    tool_en: "The skin-with-vessel preset (500 nm) under Simulation is the same kind of problem."
  - title: "Determining the optical properties of turbid media by using the adding–doubling method"
    cite: "Prahl SA, van Gemert MJC, Welch AJ. Applied Optics, 1993, 32(4): 559–568"
    link: "https://doi.org/10.1364/AO.32.000559"
    zh: "加倍法：均匀平板反射和透射的确定性解，和蒙特卡洛完全独立。"
    en: "Adding–doubling: a deterministic solution for slab reflection and transmission, fully independent of Monte Carlo."
    tool_zh: "“验证”页用它（iadpython）核对本引擎，不需要 MATLAB。"
    tool_en: "The Validation page checks this engine against it (iadpython), with no MATLAB needed."
  - title: "Monte Carlo simulation of photon migration in 3D turbid media accelerated by graphics processing units"
    cite: "Fang Q, Boas DA. Optics Express, 2009, 17(22): 20178–20190"
    link: "https://doi.org/10.1364/OE.17.020178"
    zh: "MCX：在 GPU 上并行跑光子，三维体素介质。"
    en: "MCX: photons run in parallel on the GPU, in 3D voxel media."
    tool_zh: "GPU 加速调研和 Mac 上的可行性实测见 project/public/gpu_mcx/。"
    tool_en: "The GPU study and a feasibility test on a Mac are in project/public/gpu_mcx/."
frontier:
  - title: "Improving model-based functional near-infrared spectroscopy analysis using mesh-based anatomical and light-transport models"
    cite: "Tran AP, Yan S, Fang Q. Neurophotonics, 2020, 7(1): 015008"
    link: "https://doi.org/10.1117/1.NPh.7.1.015008"
    zh: "用网格化的头部解剖模型和光传输模型改进近红外脑功能（fNIRS）分析。"
    en: "Mesh-based head anatomy and light-transport models to improve fNIRS analysis."
    tool_zh: "我们还没有头部模型；这是补头部预设时的参照。"
    tool_en: "We have no head model yet; this is the reference for adding one."
  - title: "Machine learning estimation of tissue optical properties"
    cite: "Hokr BH, Bixler JN. Scientific Reports, 2021, 11: 6561"
    link: "https://doi.org/10.1038/s41598-021-85994-w"
    zh: "用蒙特卡洛模拟的时间分辨信号训练神经网络，快速反演组织光学参数；只在单层均匀模型上报告了结果。"
    en: "A neural network trained on Monte Carlo time-resolved signals estimates tissue optical properties quickly; results are reported for a single homogeneous layer only."
    tool_zh: "“仿真 + 机器学习”的方向；需要大量仿真，见 GPU 调研。"
    tool_en: "The simulation + machine-learning direction; it needs many simulations, see the GPU study."
  - title: "MW-FlexNIRS: wavelength-weighted fitting for wearable NIRS"
    cite: "Otic et al. Biomedical Optics Express, 2026, 17(4): 1649–1672"
    link: "https://doi.org/10.1364/BOE.590418"
    zh: "可穿戴近红外：拟合时考虑 LED 宽谱、探测器响应和组织光学性质。"
    en: "Wearable NIRS: fitting that accounts for broadband LEDs, detector response and tissue optics."
    tool_zh: "和可穿戴头带的测量直接相关（第一期分享第 20 页的方向之一）。"
    tool_en: "Directly relevant to wearable headband sensing (one of the directions in our first talk)."
  - title: "In vivo optical properties of human tissues at several sites and wavelengths (dataset)"
    cite: "Damagatla et al. Scientific Data, 2026"
    link: "https://doi.org/10.1038/s41597-026-06586-9"
    zh: "5 个身体部位、10 名受试者的在体光学参数数据集。"
    en: "An in vivo optical-property dataset: 5 body sites, 10 subjects."
    tool_zh: "可作为新预设的参数来源。"
    tool_en: "A possible source of parameters for new presets."
