[project]
name = "mcsim"
version = "0.1.0"
description = "Monte Carlo light transport in tissue (voxel model), ported from the legacy MATLAB prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "numba>=0.60",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "plotly>=5.20",
    "streamlit>=1.35",
    "iadpython>=0.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "h5py>=3.10",
]

[project.scripts]
mcsim = "mcsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds"]
