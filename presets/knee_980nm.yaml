# 膝关节模型，980 nm。数值逐项取自 legacy/matlab/5demo（Tissue_knee.m、Tissue _optical_parameters.m、Light_T.m）。
# 本文件用 cm 和 1/cm（与文献一致），载入时自动换算成 mm。
name: knee_980nm
title: 膝关节模型（980 nm）
title_en: Knee (980 nm)
based_on: legacy/matlab/5demo
length_unit: cm
display_unit: cm

geometry:
  type: knee
  shape: [160, 96, 168]
  voxel: 0.125
  surface_z: 4.0            # 名义上的膝盖接触深度；实际皮肤面是弯曲的
  # 外轮廓 = 膝部皮肤边界；按标注示意图手绘，不是 CT/MRI 数据
  outer_contour: [[-3, 6.5], [-3.6, 8.5], [-4, 10.5], [-4.8, 12.1], [-5, 13.6], [-4.6, 15.2],
                  [-3.4, 16.7], [-1.5, 18.2], [0.4, 18.4], [2.4, 18.1], [4.5, 17], [6.3, 16], [8, 14.4],
                  [8.8, 12.5], [8.5, 10.6], [7.5, 8.6], [5.8, 7], [4.2, 5.9], [2.4, 4.7], [1, 4],
                  [-0.5, 4], [-1.8, 4.8], [-2.5, 5.7]]
  bone_contour: [[-2.6, 8.2], [-2.9, 10], [-3.3, 12], [-3.1, 13.4], [-2.4, 14.4], [-1.4, 14.6],
                 [-0.7, 13.9], [-0.1, 12.3], [0.6, 11.5], [1.7, 11.4], [2.6, 11.7], [3.2, 12.7], [4.4, 12.6],
                 [5.5, 12], [5.8, 10.8], [5.5, 9.4], [4.6, 8.3], [3.2, 7.7], [1.7, 7.2], [0.4, 7.8], [-1, 8]]
  # 髌骨：成人 MRI 长宽约 4.4 cm、厚约 2.0 cm（Meier 等，DOI 10.1007/s00256-024-04794-1）
  patella: {x: 0.5, z: 5.8, half_length: 2.2, half_thickness: 1.0, tilt: 0.2}
  taper_pivot: [1, 11.5]       # 各 y 截面向这一点按比例收缩（建模假设）
  body_half_width_y: 4.8
  patella_half_width_y: 2.2
  stride: 1

tissues:
  - {label: 1, name: 空气, name_en: Air, mua: 0.0, mus: 0.0, g: 0.0, n: 1.0, source: 按无吸收、无散射处理,
     source_en: Treated as non-absorbing and non-scattering}
  - {label: 2, name: 软组织, name_en: Soft tissue, mua: 0.60, musp: 6.10, g: 0.9, n: 1.4,
     source: "以肌肉代替：Chaki 等 2023，表 1，980 nm，DOI 10.1002/jbio.202200283；g、n 为假设",
     source_en: "Muscle as a proxy: Chaki et al. 2023, Table 1, 980 nm, DOI 10.1002/jbio.202200283; g and n assumed"}
  - {label: 3, name: 髌骨, name_en: Patella, mua: 0.136666666666667, musp: 5.52, g: 0.9, n: 1.4,
     source: "假设与胫骨 B 点相同，不是髌骨实测：Kothuri 2025，DOI 10.1038/s41598-025-06138-y；g、n 为假设",
     source_en: "Assumed equal to tibia point B, not measured on the patella: Kothuri 2025, DOI 10.1038/s41598-025-06138-y; g and n assumed"}
  - {label: 4, name: 骨, name_en: Bone, mua: 0.136666666666667, musp: 5.52, g: 0.9, n: 1.4,
     source: "Kothuri 2025，Zenodo 14170681 ABC.txt 胫骨 B 点 980 nm 三次重复均值：mua=(.14+.13+.14)/3，musp=(5.55+5.31+5.70)/3；DOI 10.1038/s41598-025-06138-y；g、n 为假设",
     source_en: "Kothuri 2025, Zenodo 14170681 ABC.txt, tibia point B at 980 nm, mean of three repeats: mua=(.14+.13+.14)/3, musp=(5.55+5.31+5.70)/3; DOI 10.1038/s41598-025-06138-y; g and n assumed"}

source:
  wavelength_nm: 980
  diameter: 8.0            # 准直圆形光束直径
  x: 0.0
  y: 0.0
  theta_deg: 0.0
  phi_deg: 0.0
  power_w: 20.0            # 总光功率
  launch_from_air: true    # 从 z=0 的空气中发射，在真实的弯曲皮肤面上做反射和折射
  emission_z: 0.0
  entry_label: 2

run:
  photons: 20000
  seed: 1
  batch_size: 2000
  workers: 1

notes:
  - 光源参数有三个版本：Light_T.m 为直径 8 cm、20 W（本文件采用）；README_简约版.txt 为直径 2.5 cm、0.1 W/cm²；光学参数原说明为直径 2 cm、0.1 W/cm²。待确认。
  - 光学参数是文献代理值和插值，不针对具体受试者校准。
notes_en:
  - The light source exists in three versions: Light_T.m uses an 8 cm diameter and 20 W (used here); README_简约版.txt uses 2.5 cm and 0.1 W/cm²; the original parameter notes use 2 cm and 0.1 W/cm². To be confirmed.
  - Optical properties are literature proxies and interpolations, not calibrated to any subject.
